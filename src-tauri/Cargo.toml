[package]
name = "levels"
version = "0.2.1"
description = "Levels — a Solo Leveling-style life-RPG habit tracker"
edition = "2021"

[lib]
name = "levels_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-sql = { version = "2.6.0", features = ["sqlite"] }
tauri-plugin-notification = "2.8.0"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-store = "2.5.0"
tauri-plugin-opener = "2.7.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time"] }
rand = "0.9"

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
