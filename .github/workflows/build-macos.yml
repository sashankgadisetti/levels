name: Build macOS
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # Code signing is optional. Export the APPLE_* secrets only when they are set: an empty
      # APPLE_CERTIFICATE makes Tauri try (and fail) to import a certificate.
      - name: Export signing secrets if configured
        shell: bash
        env:
          S_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          S_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          S_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          S_APPLE_ID: ${{ secrets.APPLE_ID }}
          S_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          S_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for k in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            v="S_$k"; v="${!v}"
            if [ -n "$v" ]; then { echo "$k<<__EOF__"; echo "$v"; echo "__EOF__"; } >> "$GITHUB_ENV"; echo "$k: set"; else echo "$k: not set (unsigned build)"; fi
          done
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target universal-apple-darwin
          # On a v* tag: create a GitHub Release and attach the .dmg (pre-release while unsigned).
          # On a manual run (no tag): just build and upload the artifact below.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "Levels v__VERSION__"
          releaseBody: "Solo Leveling–style life RPG for macOS. Unsigned build: on first launch right-click the app and choose Open, or run `xattr -dr com.apple.quarantine /Applications/Levels.app`. Install by dragging Levels.app into Applications."
          releaseDraft: false
          prerelease: true
      - uses: actions/upload-artifact@v4
        with:
          name: levels-macos-dmg
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
