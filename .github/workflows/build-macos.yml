name: Build macOS
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Publish a GitHub Release under this tag (e.g. v0.1.0). Leave empty to only build."
        required: false
        default: ""
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # Code signing is optional. Without the secrets the app is ad-hoc signed (signingIdentity "-" in
      # tauri.conf.json), which avoids the "is damaged" error on Apple Silicon. Export the APPLE_* secrets only when they are set: an empty
      # APPLE_CERTIFICATE makes Tauri try (and fail) to import a certificate.
      # Auto-update: when TAURI_SIGNING_PRIVATE_KEY is set (contents of the key from `tauri signer generate`, see SETUP.md),
      # tauri-action signs the updater bundle (createUpdaterArtifacts in tauri.conf.json) and uploads latest.json +
      # Levels.app.tar.gz(.sig) to the release; installed apps poll releases/latest/download/latest.json. Without the key the
      # build still works but produces no update artifacts
      # (createUpdaterArtifacts is switched off via TAURI_EXTRA_ARGS). The key password may legitimately be empty, so it is exported
      # whenever the private key is set.
      - name: Export signing secrets if configured
        shell: bash
        env:
          S_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          S_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          S_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          S_APPLE_ID: ${{ secrets.APPLE_ID }}
          S_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          S_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          S_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          S_TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for k in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            v="S_$k"; v="${!v}"
            if [ -n "$v" ]; then { echo "$k<<__EOF__"; echo "$v"; echo "__EOF__"; } >> "$GITHUB_ENV"; echo "$k: set"; else echo "$k: not set (unsigned build)"; fi
          done
          if [ -n "$S_TAURI_SIGNING_PRIVATE_KEY" ]; then
            { echo "TAURI_SIGNING_PRIVATE_KEY<<__EOF__"; echo "$S_TAURI_SIGNING_PRIVATE_KEY"; echo "__EOF__"; } >> "$GITHUB_ENV"
            { echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD<<__EOF__"; echo "$S_TAURI_SIGNING_PRIVATE_KEY_PASSWORD"; echo "__EOF__"; } >> "$GITHUB_ENV"
            # releases/latest/download/latest.json skips pre-releases, so updatable builds publish as full releases.
            echo "LEVELS_PRERELEASE=false" >> "$GITHUB_ENV"
            echo "TAURI_SIGNING_PRIVATE_KEY: set (update bundles + latest.json will be signed and uploaded)"
          else
            # `tauri build` refuses createUpdaterArtifacts without a private key, so switch it off for this build only.
            echo '{"bundle":{"createUpdaterArtifacts":false}}' > "$RUNNER_TEMP/no-updater.json"
            echo "TAURI_EXTRA_ARGS=--config $RUNNER_TEMP/no-updater.json" >> "$GITHUB_ENV"
            echo "TAURI_SIGNING_PRIVATE_KEY: not set (no auto-update artifacts)"
          fi
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target universal-apple-darwin ${{ env.TAURI_EXTRA_ARGS }}
          # On a v* tag: create a GitHub Release and attach the .dmg (pre-release while unsigned).
          # On a manual run (no tag): just build and upload the artifact below.
          tagName: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
          releaseName: "Levels v__VERSION__"
          releaseBody: |
            **Levels** — a Solo Leveling–style life RPG for macOS (universal: Apple Silicon + Intel).

            **Install:** open the `.dmg` and drag Levels into Applications.
            **First launch:** this build is not notarized, so macOS blocks it and offers "Move to Trash".
            Click **Done** (not Move to Trash), then run this once in Terminal and open Levels again:
            `xattr -cr /Applications/Levels.app`
            (or: System Settings → Privacy & Security → scroll down → **Open Anyway**).

            Your data lives in `~/Library/Application Support/dev.levels.app/levels.db`.
            Optional Oracle (Claude-generated quests): Settings → Oracle → paste an Anthropic API key.
          releaseDraft: false
          # Pre-release unless the build is signed for auto-update (see the export step).
          prerelease: ${{ env.LEVELS_PRERELEASE != 'false' }}
      - uses: actions/upload-artifact@v4
        with:
          name: levels-macos-dmg
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
